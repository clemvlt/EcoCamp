<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EcoCamp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-box">
            <div class="brand" style="justify-content: center; margin-bottom: 20px;">
                <span class="flower-icon">✿</span>
                <div class="brand-text">flower <span>campings</span></div>
            </div>
            
            <h1>EcoCamp</h1>
            <p class="text-muted">Administration Camping</p>

            <form onsubmit="event.preventDefault(); window.location.href='index.html';">
                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" name="login" class="form-input" placeholder="Identifiant" required>
                </div>

                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" name="password" class="form-input" placeholder="Mot de passe" required>
                </div>

                <button type="submit" class="btn-login">Connexion</button>
            </form>
            
            <p style="margin-top: 20px; font-size: 0.8rem; color: #94a3b8;">
                Identifiant: demo | Mot de passe: demo
            </p>
        </div>
    </div>

</body>
</html>
