<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EcoCamp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <script type="text/javascript" src="{{ url_for('static', filename='js/login.js') }}"></script>
</head>

<body class="login-page">

    <div class="login-container">
        <div class="login-box">
            <div class="brand" style="justify-content: center; margin-bottom: 20px;">
                <span class="flower-icon">✿</span>
                <div class="brand-text">flower <span>campings</span></div>
            </div>

            <h1>EcoCamp</h1>
            <p class="text-muted" style="margin-bottom: 30px;">Administration Camping</p>

            <form method="post" onsubmit="return false;">
                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" name="login" id="login" class="form-input" placeholder="Identifiant" required>
                </div>

                <div class="input-group password-group">
                    <i class="fa fa-lock"></i>
                    <button type="button" id="togglePassword" class="toggle-password" tabindex="-1">
                        <i class="fa fa-eye" id="eyeIcon"></i>
                    </button>
                    <input type="password" name="password" id="password" class="form-input" placeholder="Mot de passe"
                        required>
                </div>

                <button type="button" id="formulaire_login" class="btn-login">Connexion</button>
            </form>

            <p id="message_erreur" style="margin-top: 20px; font-size: 0.8rem; color: red;">
                &nbsp;
            </p>
        </div>
    </div>

</body>

</html>
